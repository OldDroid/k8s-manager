replicaCount: 1

image:
  repository: k8s-manager
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Namespaced Role + RoleBinding for pod inspection and deployment scaling.
  create: true

service:
  type: ClusterIP
  port: 9080

# k3s external access (traefik is the default ingress class on k3s).
ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: k8s-manager.localhost
  path: /
  pathType: Prefix
  tls: []

# OpenShift external access.
openshiftRoute:
  enabled: false
  host: ""
  annotations: {}
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Leave runAsUser unset so OpenShift's restricted-v2 SCC can assign its own UID.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  path: /api/health
  initialDelaySeconds: 20
  periodSeconds: 10

env: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
